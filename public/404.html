<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{t:notFound.title|brand=ReplyLo}}</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="stylesheet" href="/assets/app.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body class="bg-mist text-ink font-sans antialiased">
<header class="sticky top-0 z-40 border-b border-line/70 bg-white/80 backdrop-blur-xl">
  <div class="mx-auto flex max-w-3xl items-center justify-between px-6 py-4">
    <a href="/" class="text-[15px] font-extrabold tracking-tight">⚡ ReplyLo</a>
    <nav class="flex flex-wrap items-center gap-x-4 gap-y-2 text-[13px] font-bold text-slateInk">
      <a class="hover:text-teal" href="/privacy">{{t:common.privacy}}</a>
      <span data-lang-switcher class="rounded-full border border-line bg-white px-3 py-1.5 text-[13px] font-bold text-slateInk"></span>
      <a class="rounded-full bg-ink px-4 py-1.5 text-white whitespace-normal" href="/app">{{t:common.dashboard}}</a>
    </nav>
  </div>
</header>
<main class="mx-auto flex max-w-3xl flex-col items-start px-6 py-20">
  <p class="text-[13px] font-extrabold uppercase tracking-widest text-teal">{{t:notFound.kicker}}</p>
  <h1 class="mt-3 text-4xl font-extrabold tracking-tight">{{t:notFound.heading}}</h1>
  <p class="mt-3 max-w-md text-[15px] leading-relaxed text-slateInk">
    {{t:notFound.body}}
  </p>
  <div class="mt-8 flex flex-wrap gap-3">
    <a class="rounded-full bg-teal px-6 py-3 text-sm font-extrabold text-white" href="/">{{t:notFound.home}}</a>
    <a class="rounded-full border border-line bg-white px-6 py-3 text-sm font-extrabold text-ink" href="/app">{{t:notFound.openDashboard}}</a>
    <a class="rounded-full border border-line bg-white px-6 py-3 text-sm font-extrabold text-ink" href="/login">{{t:notFound.signIn}}</a>
  </div>
</main>
</body>
</html>
