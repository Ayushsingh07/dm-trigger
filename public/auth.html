<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{t:auth.signinTitle|brand=ReplyLo}}</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="stylesheet" href="/assets/app.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html { scroll-behavior: smooth; }
  ::selection { background: #0d9488; color: #fff; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }
</style>
</head>
<body class="bg-mist text-ink font-sans antialiased">
<div class="grid min-h-screen place-items-center px-4">
  <div class="w-full max-w-[400px]">
    <a href="/" class="mx-auto mb-6 flex w-fit items-center gap-2.5 text-[18px] font-extrabold tracking-tight">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-teal to-teal-dark text-white shadow-soft">⚡</span>
      ReplyLo
    </a>

    <div class="rounded-2xl border border-line bg-white p-7 shadow-soft">
      <h1 id="title" class="text-[22px] font-extrabold tracking-tight">{{t:auth.welcomeBack}}</h1>
      <p id="subtitle" class="mt-1 text-[14px] text-slateInk">{{t:auth.signinSub}}</p>

      <form id="form" class="mt-6 grid gap-3.5" novalidate>
        <label id="nameField" class="hidden flex-col gap-1.5">
          <span class="text-[11px] font-extrabold uppercase tracking-widest text-slate-400">{{t:auth.name}}</span>
          <input name="name" autocomplete="name" class="rounded-xl border border-line bg-mist px-3.5 py-2.5 text-[15px] outline-none transition focus:border-teal focus:bg-white focus:ring-4 focus:ring-teal/10" placeholder="{{t:auth.namePlaceholder}}" />
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-[11px] font-extrabold uppercase tracking-widest text-slate-400">{{t:auth.email}}</span>
          <input name="email" type="email" autocomplete="email" required class="rounded-xl border border-line bg-mist px-3.5 py-2.5 text-[15px] outline-none transition focus:border-teal focus:bg-white focus:ring-4 focus:ring-teal/10" placeholder="{{t:auth.emailPlaceholder}}" />
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-[11px] font-extrabold uppercase tracking-widest text-slate-400">{{t:auth.password}}</span>
          <input name="password" type="password" autocomplete="current-password" required minlength="10" class="rounded-xl border border-line bg-mist px-3.5 py-2.5 text-[15px] outline-none transition focus:border-teal focus:bg-white focus:ring-4 focus:ring-teal/10" placeholder="{{t:auth.passwordPlaceholder}}" />
        </label>

        <p id="error" class="hidden rounded-lg bg-rose-50 px-3 py-2 text-[13px] font-semibold text-rose-600"></p>

        <button id="submit" type="submit" class="mt-1 rounded-full bg-teal px-5 py-3 text-[15px] font-bold text-white shadow-soft transition hover:bg-teal-dark hover:shadow-chip active:scale-[.98] disabled:opacity-60">
          {{t:auth.signin}}
        </button>
      </form>

      <p class="mt-5 text-center text-[13px] text-slateInk">
        <span id="swapQ">{{t:auth.newHere}}</span>
        <a id="swapLink" href="/signup" class="font-bold text-teal-dark hover:underline">{{t:auth.createAccount}}</a>
      </p>
    </div>

    <p class="mt-6 text-center text-[12px] text-slate-400">
      <a href="/" class="font-semibold hover:text-ink">{{t:auth.backDemo}}</a>
    </p>
    <div class="mt-4 flex justify-center">
      <span data-lang-switcher="rounded-full border border-line bg-white px-3 py-1.5 text-[13px] font-bold text-slateInk"></span>
    </div>
  </div>
</div>

<script>
const T = (k, v) => (window.I18N ? window.I18N.t(k, v) : k);
const form = document.getElementById("form");
const errorEl = document.getElementById("error");
const submitBtn = document.getElementById("submit");
const nameField = document.getElementById("nameField");
const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const swapQ = document.getElementById("swapQ");
const swapLink = document.getElementById("swapLink");

const mode = () => (location.pathname === "/signup" ? "signup" : "login");

function render() {
  const signup = mode() === "signup";
  document.title = T(signup ? "auth.signupTitle" : "auth.signinTitle", { brand: "ReplyLo" });
  title.textContent = T(signup ? "auth.signupHeading" : "auth.welcomeBack");
  subtitle.textContent = T(signup ? "auth.signupSub" : "auth.signinSub");
  nameField.classList.toggle("hidden", !signup);
  nameField.classList.toggle("flex", signup);
  submitBtn.textContent = T(signup ? "auth.signup" : "auth.signin");
  swapQ.textContent = T(signup ? "auth.haveAccount" : "auth.newHere");
  swapLink.textContent = T(signup ? "auth.signin" : "auth.createAccount");
  swapLink.href = signup ? "/login" : "/signup";
  hideError();
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.remove("hidden");
  form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
}
function hideError() { errorEl.classList.add("hidden"); }

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  hideError();
  submitBtn.disabled = true;
  submitBtn.textContent = T("auth.working");
  const data = Object.fromEntries(new FormData(form).entries());
  try {
    const res = await fetch(`/auth/${mode()}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) {
      showError(json.error || T("auth.genericError"));
      submitBtn.disabled = false;
      submitBtn.textContent = mode() === "signup" ? T("auth.signup") : T("auth.signin");
      return;
    }
    location.href = json.role === "admin" ? "/admin" : "/app";
  } catch {
    showError(T("auth.networkError"));
    submitBtn.disabled = false;
    submitBtn.textContent = mode() === "signup" ? T("auth.signup") : T("auth.signin");
  }
});

// if already signed in, skip straight in
fetch("/auth/me").then((r) => r.json()).then((j) => {
  if (j.user) location.href = j.user.role === "admin" ? "/admin" : "/app";
}).catch(() => {});

render();
window.addEventListener("popstate", render);
swapLink.addEventListener("click", (e) => {
  e.preventDefault();
  history.pushState({}, "", swapLink.getAttribute("href"));
  render();
});
</script>
</body>
</html>
